name: Pages

# Builds the download page with tools/site/build.js (site/ at the root, the cat scene from web/
# under cat/ as the page's live demo, the README gif), adds stats.json with the download count
# and deploys it to GitHub Pages. Runs again every few hours, so stats.json stays close to the
# live count the page also asks for. Pull requests only build it, as a check. Only
# ElloboDK/KeyCat deploys; anywhere else it runs nothing but those checks.
on:
  push:
    branches: [main]
    paths: ['site/**', 'web/**', 'assets/keycat.gif', 'tools/site/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'web/**', 'assets/keycat.gif', 'tools/site/**', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: true

# Upload and deploy are separate jobs: in one job deploy-pages sometimes looks the artifact up a
# few hundred ms after it is finalized, finds nothing and fails, so stats.json stopped updating
# (actions/deploy-pages#451). A job boundary gives the lookup seconds instead.
jobs:
  build:
    if: github.repository == 'ElloboDK/KeyCat' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Build the page
        run: node tools/site/build.js _site

      - name: Add the download count
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every macOS zip and Windows and Linux installer across all releases; checksums and
          # update manifests are left out.
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '
            map(select(.draft or .prerelease | not))
            | { downloads: ([.[].assets[] | select(.name | test("\\.(zip|exe|AppImage|deb)$"; "i")) | .download_count] | add // 0),
                version: (.[0].tag_name // ""), published: (.[0].published_at // ""), updated: (now | todate) }' > _site/stats.json
          cat _site/stats.json

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name != 'pull_request'

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
